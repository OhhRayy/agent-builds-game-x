<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake — built from one prompt</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #07070f;
    color: #e8fff2;
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #39ff88;
    text-shadow: 0 0 18px rgba(57, 255, 136, .8);
  }
  h1 span { color: #ff2ea6; text-shadow: 0 0 18px rgba(255, 46, 166, .8); }
  #hud {
    display: flex;
    gap: 28px;
    font-size: 15px;
    color: #9be8ff;
  }
  #hud b { color: #fff; }
  canvas {
    background: #0b0b1a;
    border: 2px solid #23234d;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(57, 255, 136, .15), 0 0 60px rgba(255, 46, 166, .10);
    max-width: 92vw;
    max-height: 62vh;
    touch-action: none;
  }
  #msg {
    font-size: 14px;
    color: #c9c9e8;
    text-align: center;
    line-height: 1.6;
    min-height: 44px;
  }
  #msg b { color: #39ff88; }
  button {
    font: inherit;
    font-size: 15px;
    padding: 10px 26px;
    border: 0;
    border-radius: 999px;
    background: #39ff88;
    color: #06130b;
    cursor: pointer;
    box-shadow: 0 0 24px rgba(57, 255, 136, .5);
  }
  button:hover { background: #6dffab; }
  footer { font-size: 12px; color: #66668c; }
  footer a { color: #ff2ea6; text-decoration: none; }
</style>
</head>
<body>
  <h1>NEON <span>SNAKE</span></h1>
  <div id="hud">
    <div>SCORE <b id="score">0</b></div>
    <div>BEST <b id="best">0</b></div>
    <div>SPEED <b id="speed">1x</b></div>
  </div>
  <canvas id="game" width="480" height="480"></canvas>
  <div id="msg">Steer with <b>arrow keys</b> or <b>WASD</b> — swipe on touch.<br>Eat the glowing orbs. Walls and your own tail end the run.</div>
  <button id="restart" hidden>PLAY AGAIN</button>
  <footer>Built from one prompt by an AI agent · <a href="https://make.fun">make.fun</a></footer>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const speedEl = document.getElementById('speed');
  const msgEl = document.getElementById('msg');
  const restartBtn = document.getElementById('restart');

  const CELLS = 24;                 // 24 x 24 grid
  const CELL = canvas.width / CELLS; // 20 px per cell
  const BASE_MS = 150;               // starting tick, gets faster per orb
  const MIN_MS = 55;

  // Best score survives a reload.
  let best = Number(localStorage.getItem('neon-snake-best') || 0);
  let snake, dir, pendingDir, orb, score, timer, alive, tickMs;

  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 };
    pendingDir = dir;
    score = 0;
    tickMs = BASE_MS;
    alive = true;
    restartBtn.hidden = true;
    msgEl.innerHTML = 'Steer with <b>arrow keys</b> or <b>WASD</b> — swipe on touch.<br>Eat the glowing orbs. Walls and your own tail end the run.';
    placeOrb();
    updateHud();
    clearTimeout(timer);
    timer = setTimeout(tick, tickMs);
  }

  function placeOrb() {
    do {
      orb = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
    } while (snake.some(s => s.x === orb.x && s.y === orb.y));
  }

  function updateHud() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    speedEl.textContent = (BASE_MS / tickMs).toFixed(1) + 'x';
  }

  function tick() {
    if (!alive) return;
    dir = pendingDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // Walls kill you.
    if (head.x < 0 || head.y < 0 || head.x >= CELLS || head.y >= CELLS) return gameOver();
    // Your own tail kills you.
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (head.x === orb.x && head.y === orb.y) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('neon-snake-best', String(best));
      }
      tickMs = Math.max(MIN_MS, tickMs - 6); // faster with every bite
      placeOrb();
      updateHud();
    } else {
      snake.pop();
    }
    draw();
    timer = setTimeout(tick, tickMs);
  }

  function gameOver() {
    alive = false;
    clearTimeout(timer);
    msgEl.innerHTML = `Game over — you scored <b>${score}</b>.`;
    restartBtn.hidden = false;
    draw(true);
  }

  function draw(dead) {
    ctx.fillStyle = '#0b0b1a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Faint grid.
    ctx.strokeStyle = 'rgba(120,120,255,0.07)';
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(canvas.width, i * CELL); ctx.stroke();
    }

    // Glowing orb.
    const ox = orb.x * CELL + CELL / 2, oy = orb.y * CELL + CELL / 2;
    const glow = ctx.createRadialGradient(ox, oy, 2, ox, oy, CELL);
    glow.addColorStop(0, '#fff');
    glow.addColorStop(0.35, '#ff2ea6');
    glow.addColorStop(1, 'rgba(255,46,166,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(ox, oy, CELL, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd7ef';
    ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2); ctx.fill();

    // Snake: neon green, head brightest.
    snake.forEach((seg, i) => {
      const t = 1 - i / snake.length;
      ctx.fillStyle = i === 0 ? '#a9ffcb' : `rgba(57,255,136,${0.35 + 0.65 * t})`;
      ctx.shadowColor = '#39ff88';
      ctx.shadowBlur = i === 0 ? 18 : 10;
      const pad = 1.5;
      ctx.beginPath();
      ctx.roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
      ctx.fill();
    });
    ctx.shadowBlur = 0;

    if (dead) {
      ctx.fillStyle = 'rgba(7,7,15,0.72)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff2ea6';
      ctx.font = 'bold 34px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 8);
      ctx.fillStyle = '#e8fff2';
      ctx.font = '18px ui-monospace, monospace';
      ctx.fillText(`Score ${score}  ·  Best ${best}`, canvas.width / 2, canvas.height / 2 + 26);
    }
  }

  const KEYS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
  };
  window.addEventListener('keydown', (e) => {
    const next = KEYS[e.code];
    if (!next) return;
    e.preventDefault();
    // No reversing into yourself.
    if (next.x === -dir.x && next.y === -dir.y) return;
    pendingDir = next;
  });

  // Touch: swipe to steer.
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', (e) => {
    if (!touchStart) return;
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    const next = Math.abs(dx) > Math.abs(dy)
      ? { x: Math.sign(dx), y: 0 }
      : { x: 0, y: Math.sign(dy) };
    if (!(next.x === -dir.x && next.y === -dir.y)) pendingDir = next;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    e.preventDefault();
  }, { passive: false });

  restartBtn.addEventListener('click', reset);

  reset();
  draw();
})();
</script>
</body>
</html>
